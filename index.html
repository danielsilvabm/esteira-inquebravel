<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esteira Inquebrável</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Projeto DevOps</h1>

    <div class="card">
      <h2>Validação Automatizada</h2>
      <p>
        Este projeto demonstra uma esteira CI com validação de HTML,
        validação de CSS e geração da pasta dist.
      </p>
      <button class="button">Saiba Mais</button>
    </div>

    <div class="card">
      <h2>Pipeline Segura</h2>
      <p>
        A entrega só acontece se todas as validações forem aprovadas.
      </p>
      <button class="button">Testar Pipeline</button>
    </div>
  </div>
</body>
</html>
