name: CI + Deploy GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  validar-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g htmlhint

      - name: Validar HTML
        run: htmlhint "**/*.html"


  validar-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g stylelint stylelint-config-standard

      - run: echo '{ "extends": "stylelint-config-standard" }' > .stylelintrc.json

      - name: Validar CSS
        run: stylelint "**/*.css"


  preparar-entrega:
    runs-on: ubuntu-latest
    needs: [validar-html, validar-css]

    steps:
      - uses: actions/checkout@v4

      - name: Criar pasta dist
        run: |
          mkdir dist
          cp -r *.html *.css dist/

      - name: Upload artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist


  deploy:
    needs: preparar-entrega
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4