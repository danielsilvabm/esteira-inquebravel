name: CI + Deploy

on:
  push:
    branches: [ "main" ]

jobs:

  validar-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar htmlhint
        run: npm install -g htmlhint

      - name: Validar HTML
        run: htmlhint "**/*.html"


  validar-css:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar stylelint
        run: npm install -g stylelint stylelint-config-standard

      - name: Criar config
        run: echo '{ \"extends\": \"stylelint-config-standard\" }' > .stylelintrc.json

      - name: Validar CSS
        run: stylelint "**/*.css"


  preparar-entrega:
    runs-on: ubuntu-latest
    needs: [validar-html, validar-css]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar pasta dist
        run: |
          mkdir dist
          cp *.html dist/ || true
          cp *.css dist/ || true